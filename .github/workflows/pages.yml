name: Deploy Truth Table Simulator to GitHub Pages

on:
  push:
    branches:
      - utama
    paths:
      - "09_Tahqiq/03_Sumber_Digital_Volume_09/QR_Code/Kelas10/Bab01/truth-table-simulator/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Truth Table Simulator
        uses: actions/upload-pages-artifact@v4
        with:
          path: "09_Tahqiq/03_Sumber_Digital_Volume_09/QR_Code/Kelas10/Bab01/truth-table-simulator"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
